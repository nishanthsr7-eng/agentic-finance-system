# Render blueprint — free-tier deployment of the FLUX backend.
#
# Render reads this when you create a Blueprint from the repo, so the service
# arrives configured rather than needing a dozen dashboard fields set by hand.
#
# The free plan gives 512 MB RAM and 0.1 CPU, which is why the image builds
# slim (no torch) and SENTIMENT_BACKEND is pinned to llm. See
# backend/requirements-slim.txt for exactly what that trades away.
#
# Secrets are deliberately NOT here — sync:false means Render prompts for them
# on first deploy and stores them itself. Nothing sensitive belongs in a file
# that is committed to a public repo.

services:
  - type: web
    name: flux-api
    runtime: docker
    plan: free
    region: singapore          # same region as the TiDB Serverless cluster;
                               # the API is chattier with MySQL than with users
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      # ── LLM (chat, insights, and news sentiment) ──────────────────────────
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false

      # Layer 2c runs through the chat model here: FinBERT needs torch, and
      # torch needs 445 MB this plan does not have.
      - key: SENTIMENT_BACKEND
        value: llm

      # ── MySQL (TiDB Serverless) ───────────────────────────────────────────
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        value: flux
      - key: MYSQL_SSL
        value: "true"

      # ── Auth ──────────────────────────────────────────────────────────────
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_SECRET
        generateValue: true     # Render generates and stores a random secret

      # ── Ingestion ──────────────────────────────────────────────────────────
      # Market-data quota is the binding constraint on this deployment, not
      # compute. At the 5-minute default NewsAPI's 100 requests/day are gone
      # before lunch. Every value below is read by ingestion.build_scheduler.
      - key: INGESTION_ENABLED
        value: "true"
      - key: INGESTION_INTERVAL_MIN
        value: "30"             # crypto + stocks → 48 cycles/day
      - key: OHLCV_INTERVAL_MIN
        value: "60"             # yfinance bars change slowly; halve the churn
      - key: NEWS_INTERVAL_MIN
        value: "60"             # 24 NewsAPI calls/day, well inside the 100 cap
      - key: INSIGHT_INTERVAL_MIN
        value: "60"             # insights ride the market cycle, throttled to 1h
      - key: INSIGHT_MAX_ASSETS
        value: "4"              # trimmed from 6 — each one costs an LLM call

      # ── Memory budget (512 MB) ─────────────────────────────────────────────
      # The FLUX-X prediction cycle, the drift retrain and the options snapshot
      # must not run a few minutes after boot here. They are the heaviest work
      # the process does — price history in dataframes, an HMM and a GARCH fit
      # per asset — and running them on every start is what turns a single OOM
      # kill into a restart loop, since each restart queues them again. Their
      # cron triggers (00:20 / 00:30 / Sun 02:00 UTC) are unaffected, and
      # POST /ingestion/trigger/predictions runs the cycle on demand (it needs the
      # X-Admin-Token header, so ADMIN_TOKEN must be set on the service first).
      - key: HEAVY_JOBS_ON_STARTUP
        value: "false"

      # The escape hatch if this still runs out of room: false drops ChromaDB,
      # onnxruntime and the MiniLM embedder from the process. RAG-backed chat
      # context and semantic search degrade; everything else is untouched. It
      # is an env-var flip in the dashboard, not a redeploy.
      - key: RAG_ENABLED
        value: "true"

      # ── CORS ──────────────────────────────────────────────────────────────
      # Set to the Cloudflare Pages origin once that project exists. Until then
      # the browser will block every cross-origin call from the deployed site.
      - key: CORS_ORIGINS
        sync: false

      # ── Market data ───────────────────────────────────────────────────────
      - key: FINNHUB_API_KEY
        sync: false
      - key: COINGECKO_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
