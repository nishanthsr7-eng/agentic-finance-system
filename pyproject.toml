[project]
name = "flux-agentic-finance-system"
version = "1.0.0"
description = "Agentic AI Finance & Stock Prediction System: an autonomous, calibrated market-prediction agent behind a paper-trading wallet."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nishanth S", email = "nishanth.sr.7@gmail.com" }]
keywords = ["fintech", "machine-learning", "xgboost", "fastapi", "conformal-prediction"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# This file exists for metadata and for the pytest/ruff config below — the app
# is never installed as a package (Docker and CI both install from
# backend/requirements*.txt). Without an explicit empty package list setuptools
# tries to auto-discover, finds js/, css/, pages/, backend/ and the rest side by
# side in a flat layout, and refuses to build. Any build host that spots a
# pyproject.toml and runs `pip install .` — Cloudflare Pages does — then fails
# before the real frontend build ever starts.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
minversion = "8.0"
# The prediction-agent suites and the API unit tests are the real tests. scripts/ holds one-shot
# research probes and training gates, never collect from there.
testpaths = ["backend/prediction", "backend/tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "node_modules", "Dataset", "flux_chroma"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade and bugbear. `ruff format` owns layout,
# so line length is not linted (long strings and comments stay readable).
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length: handled by the formatter
    "E731",  # lambda assignment: used for short local helpers
    "E741",  # ambiguous names like `l`: idiomatic in the numeric code
    "B905",  # zip(strict=): adding it would change behaviour on unequal inputs
    "UP031", # percent format: kept where it defines a stored format (password hash)
]

[tool.ruff.lint.per-file-ignores]
"backend/prediction/test_*.py" = ["E402"]
"scripts/*.py" = ["E402", "F401", "F841", "B008"]
"backend/rag.py" = ["E402"]  # env vars must be set before chromadb is imported
