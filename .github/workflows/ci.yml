name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Prediction agent tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Not the full requirements file: chronos-forecasting and statsforecast
        # are import-guarded and multi-GB, so they are skipped. torch comes from
        # the CPU wheel index — the CUDA build is ~4x larger and unused on runners.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pandas numpy scipy scikit-learn statsmodels xgboost                       aiosqlite httpx joblib pydantic-settings pymysql yfinance                       hmmlearn praw transformers arch

      - name: Run test suite
        run: pytest backend/prediction -q

  api-tests:
    name: API tests (slim deps, Python 3.11)
    # Same Python and locked requirements as the Docker image Render runs. The
    # tests fake MySQL and the network, so no database or secret is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-slim.lock
      - run: pip install -r backend/requirements-slim.lock
      - name: Run API tests
        run: pytest backend/tests -q

  docker:
    name: Docker build + /health smoke test
    # Catches a broken Dockerfile or a startup crash before Render does. The
    # container runs with the scheduler off and no MySQL: startup must still
    # come up and answer /health (GET and HEAD), which is all Render and the
    # keep-warm Worker need.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build slim image
        run: docker build -t flux-api:ci .
      - name: Start container
        run: |
          docker run -d --name flux -p 8080:8080             -e INGESTION_ENABLED=false -e HEAVY_JOBS_ON_STARTUP=false -e DEMO_RESEED=false             flux-api:ci
      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "healthy after ~$((i * 3)) s"; break
            fi
            if [ "$i" = 60 ]; then docker logs flux; exit 1; fi
            sleep 3
          done
          curl -fsS http://localhost:8080/health
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' -I http://localhost:8080/health)" = 200
      - name: Memory after startup (informational; Render free = 512 MB)
        if: always()
        run: docker stats --no-stream --format "{{.Name}} {{.MemUsage}}"
      - name: Container logs
        if: always()
        run: docker logs flux 2>&1 | tail -50

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.6
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .

  frontend:
    name: Static build (Cloudflare Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build dist/
        run: npm run build
      - name: Check the build output
        # A page missing from the build-static.mjs allowlist, or a private file
        # leaking into it, fails here instead of on the live site.
        run: |
          for f in index.html 404.html robots.txt sitemap.xml _headers                    pages/login.html pages/signin.html pages/dashboard.html pages/advisor.html                    pages/analysis.html pages/marketplace.html pages/payments.html                    js/flux-config.js js/flux-data.js css/base.css; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          for f in backend scripts package.json IMPROVEMENTS.local.md; do
            test ! -e "dist/$f" || { echo "dist/$f must not be published"; exit 1; }
          done
          grep -q "flux-api-vono.onrender.com" dist/js/flux-config.js
