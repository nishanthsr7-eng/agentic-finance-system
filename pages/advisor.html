      </svg>
      FLUX

    <nav class="nav-group">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>

  <!-- ████ MAIN ████ -->
  <main class="dash-main">
    <header class="dash-header">
      <div style="display:flex;align-items:center;gap:16px;">
        <h1 class="header-title">Smart Advisor</h1>
      </div>
      <div class="user-profile" style="display:flex;align-items:center;gap:24px;">
        <div class="user-info"><div class="user-name">Nishanth S</div></div>
        <div class="avatar">NS</div>
      </div>
    </header>

    <div class="dash-body">
      <div class="adv-grid">

        <!-- ══════════ LEFT: COCKPIT ══════════ -->
        <div class="adv-main">

          <!-- ── CONTAINER 1: LIVE FORECAST CHART ── -->
          <section class="panel chart-panel">
            <div class="chart-head">
              <div class="asset-tabs" id="asset-tabs">
                <button class="asset-tab active" data-asset="BTC">BTC</button>
                <button class="asset-tab" data-asset="ETH">ETH</button>
              </div>
              <div class="chart-live">
                <div class="cl-price" id="cl-price">—</div>
                <div class="cl-meta">
                  <span class="cl-chg neu" id="cl-chg">—</span>
                  <span class="cl-dot" id="cl-dot" title="Live status"></span>
                  <span class="cl-live-lbl" id="cl-live-lbl">LIVE</span>
                </div>
              </div>
              <div class="tf-tabs" id="tf-tabs">
                <button class="tf-tab" data-tf="1D">1D</button>
                <button class="tf-tab active" data-tf="7D">7D</button>
                <button class="tf-tab" data-tf="1M">1M</button>
                <button class="tf-tab" data-tf="1Y">1Y</button>
              </div>
            </div>

            <!-- ── SUMMARY: the forecast first, then the chart ── -->
            <div class="verdict" id="verdict">
              <span class="skel skel-note"></span>
              <span class="skel skel-note short"></span>
            </div>

            <div class="chart-wrap" id="chart-wrap">
              <svg class="chart-svg" id="chart-svg" xmlns="http://www.w3.org/2000/svg"></svg>
              <div class="chart-crosshair" id="chart-crosshair"></div>
              <div class="chart-tooltip" id="chart-tooltip"></div>
              <div class="chart-status" id="chart-status">Loading market data…</div>
            </div>

          </section>

          <!-- ── BOTTOM ROW: 3 ANALYTICS PANELS ── -->
          <div class="bottom-row">

            <!-- CONTAINER 3: CONVICTION LEADERBOARD -->
            <section class="panel mini-panel">
              <div class="mini-head">
                <span class="mini-title">All forecasts</span>
                <span class="mini-meta" id="lb-meta">all assets</span>
              </div>
              <div class="mini-body" id="lb-body">
                <div class="skel-row"><span class="skel skel-rank"></span><span class="skel skel-sym"></span><span class="skel skel-dir"></span><span class="skel skel-bar"></span><span class="skel skel-conf"></span></div>
                <div class="skel-row"><span class="skel skel-rank"></span><span class="skel skel-sym"></span><span class="skel skel-dir"></span><span class="skel skel-bar"></span><span class="skel skel-conf"></span></div>
                <div class="skel-row"><span class="skel skel-rank"></span><span class="skel skel-sym"></span><span class="skel skel-dir"></span><span class="skel skel-bar"></span><span class="skel skel-conf"></span></div>
                <div class="skel-row"><span class="skel skel-rank"></span><span class="skel skel-sym"></span><span class="skel skel-dir"></span><span class="skel skel-bar"></span><span class="skel skel-conf"></span></div>
                <div class="skel-row"><span class="skel skel-rank"></span><span class="skel skel-sym"></span><span class="skel skel-dir"></span><span class="skel skel-bar"></span><span class="skel skel-conf"></span></div>
              </div>
            </section>

          </div>
        </div>

        <!-- ══════════ RIGHT: AURA CHAT RAIL ══════════ -->
        <aside class="panel chat-rail">
          <div class="chat-head">
            <div class="chat-id">
              <div class="chat-avatar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--A)" stroke-width="2">
                  <path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 8v4l3 3"/>
                  <circle cx="18" cy="5" r="3" fill="var(--A)" stroke="none"/>
                </svg>
              </div>
              <div>
                <div class="chat-name">Advisor</div>
                <div class="chat-sub" id="chat-sub">Ask about <span id="chat-ctx-sym">BTC</span> or your finances</div>
              </div>
            </div>
            <button class="clear-btn" id="clear-btn">Clear</button>
          </div>

          <div class="prompts-bar" id="prompts-bar">
            <span class="prompt-chip" data-dyn="explain" role="button" tabindex="0">Explain this call</span>
            <span class="prompt-chip" data-dyn="risk" role="button" tabindex="0">What's the risk?</span>
            <span class="prompt-chip" data-prompt="Compare BTC and ETH right now — which has the stronger setup?" role="button" tabindex="0">Compare BTC vs ETH</span>
            <span class="prompt-chip" data-prompt="Summarise my financial health in one paragraph." role="button" tabindex="0">My financial health</span>
          </div>

          <div class="msg-feed" id="msg-feed"></div>

          <div class="input-row">
            <textarea class="chat-input" id="chat-input"
              placeholder="Ask about this asset or your money…" rows="1"></textarea>
            <button class="send-btn" id="send-btn" title="Send">
              <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </aside>

      </div>
    </div>
  </main>
</div>

<script src="../js/flux-config.js"></script>
<script src="../js/flux-data.js"></script>
<script src="../js/seed.js"></script>
<script src="../js/advisor.js"></script>
</body>
</html>
