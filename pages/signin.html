  <link rel="stylesheet" href="../css/nav.css">

  <link rel="stylesheet" href="../css/layout-extensions.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
    }

    .auth-card {
      background: rgba(11, 11, 11, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 32px;
      padding: 48px;
      max-width: 480px;
      width: 100%;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1;
      position: relative;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .auth-header h1 {
      font-family: var(--font-serif);
      font-size: 32px;
      margin-bottom: 8px;
    }

    .auth-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      transition: all 0.3s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-teal);
      background: rgba(255, 255, 255, 0.08);
    }

    .auth-btn {
      width: 100%;
      background: linear-gradient(135deg, #888 0%, #fff 100%);
      color: #000;
      border: none;
      padding: 14px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      margin-top: 12px;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
      box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
    }

    .auth-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .auth-footer a {
      color: var(--text-primary);
      font-weight: 600;
      text-decoration: underline;
    }

    .back-home {
      position: absolute;
      top: 40px;
      left: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-secondary);
      z-index: 10;
    }
  </style>
</head>

<body class="auth-page">
  <!-- Huge Background Text -->
  <div class="bg-text-container">
    <div class="bg-text visible">fl ux</div>
  </div>

  <a href="../index.html" class="back-home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    Back to Home
  </a>

  <div class="auth-card">
    <div class="auth-header">
      <h1>Create Account</h1>
      <p>Get daily forecasts and a practice wallet. Free, and no real money involved.</p>
    </div>

    <form id="signupForm">
      <div class="form-group">
        <label class="form-label" for="su-name">Full Name</label>
        <input type="text" id="su-name" class="form-input" placeholder="Nishanth S" autocomplete="name" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="su-email">Email Address</label>
        <input type="email" id="su-email" class="form-input" placeholder="name@example.com" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="su-password">Password</label>
        <input type="password" id="su-password" class="form-input" placeholder="Min. 8 characters"
          autocomplete="new-password" minlength="8" required aria-describedby="su-password-hint">
        <p id="su-password-hint" style="margin-top:6px;font-size:12px;color:var(--text-secondary);">At least 8 characters.</p>
      </div>
      <div id="signup-error"
        style="display:none;font-size:13px;color:#ff4d4d;background:rgba(255,77,77,.08);border:1px solid rgba(255,77,77,.25);border-radius:10px;padding:10px 14px;margin-bottom:8px;">
      </div>
      <button type="submit" class="auth-btn" id="signup-btn">Sign Up</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log In</a>
    </div>
  </div>

  <script src="../js/flux-config.js"></script>
  <script>
    const API = ((window.FLUX_CONFIG && window.FLUX_CONFIG.apiBase) ||
      (['localhost', '127.0.0.1', ''].includes(location.hostname)
        ? 'http://' + (location.hostname || 'localhost') + ':8000'
        : location.origin)).replace(/\/$/, '');

    document.getElementById('signupForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn   = document.getElementById('signup-btn');
      const errEl = document.getElementById('signup-error');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Creating account…';
      // Render's free tier sleeps when idle; say so instead of a frozen button.
      const slow = setTimeout(() => {
        btn.textContent = 'Waking the server (free tier, up to a minute)…';
      }, 3000);
      try {
        const res = await fetch(API + '/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('su-name').value.trim(),
            email: document.getElementById('su-email').value.trim(),
            password: document.getElementById('su-password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || 'Sign up failed (' + res.status + ')');
        // New session — make sure no previous user's hydrated data lingers.
        ['flux_user', 'flux_transactions', 'flux_accounts', 'flux_portfolio', 'flux_recurring',
         'flux_contacts', 'flux_protocols',
         'flux_reward_states', 'flux_seeded'].forEach(k => localStorage.removeItem(k));
        localStorage.setItem('flux_token', data.token);
        if (data.user) localStorage.setItem('flux_user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } catch (err) {
        clearTimeout(slow);
        errEl.textContent = /failed to fetch/i.test(err.message)
          ? 'Cannot reach the FLUX server — please try again shortly.'
          : err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign Up';
      }
    });
  </script>
</body>

</html>
